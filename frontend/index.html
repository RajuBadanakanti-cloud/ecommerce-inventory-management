<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO -->
    <title>ShopSphere | E-Commerce & Inventory Management Platform</title>

    <meta
      name="title"
      content="ShopSphere | E-Commerce & Inventory Management Platform"
    />

    <meta
      name="description"
      content="ShopSphere is your destination for online shopping, product discovery, secure checkout, order management, and real-time inventory management."
    />

    <meta
      name="keywords"
      content="ShopSphere, e-commerce, online shopping, electronics, fashion, home goods, inventory management, product management, order management"
    />

    <meta name="author" content="ShopSphere" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://shopsphere-ecommerce-rbcloud.vercel.app/"
    />
    <meta
      property="og:title"
      content="ShopSphere | E-Commerce & Inventory Management Platform"
    />
    <meta
      property="og:description"
      content="Discover products, shop with confidence, manage orders, and explore ShopSphere's e-commerce experience."
    />
    <meta
      property="og:image"
      content="https://shopsphere-ecommerce-rbcloud.vercel.app/og-image.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:url"
      content="https://shopsphere-ecommerce-rbcloud.vercel.app/"
    />
    <meta
      name="twitter:title"
      content="ShopSphere | E-Commerce & Inventory Management Platform"
    />
    <meta
      name="twitter:description"
      content="Explore products, shop securely, and experience ShopSphere's e-commerce platform."
    />
    <meta
      name="twitter:image"
      content="https://shopsphere-ecommerce-rbcloud.vercel.app/og-image.png"
    />

    <!-- Performance: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
  </head>

  <body
    class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white"
  >
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
